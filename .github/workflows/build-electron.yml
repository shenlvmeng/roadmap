name: Build Electron

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15-intel
            artifact: roadmap-macos
            package-args: --mac zip
            path: build/*-mac.zip
          - name: Windows
            os: windows-2022
            artifact: roadmap-windows
            package-args: --win portable
            path: build/*.exe
          - name: Linux
            os: ubuntu-22.04
            artifact: roadmap-linux
            package-args: --linux AppImage
            path: build/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: yarn

      - name: Install dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Test
        run: corepack yarn test

      - name: Build application
        run: corepack yarn build

      - name: Package application
        run: corepack yarn dist ${{ matrix.package-args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
